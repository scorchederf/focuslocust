vault_path: "./vault"

runtime:
  # Keep the build local-only unless explicitly changed by the operator.
  # If a required source is missing, the builder should fail with the reason and requested URL.
  allow_network: false

logging:
  verbose: false
  log_dir: ".logs"

cache:
  dir: ".cache"
  refresh: false

sources:
  mitre:
    enabled: true
    domain: "enterprise-attack"
    url: "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json"
    local_path: null
    include_tactics: true
    include_techniques: true
    include_subtechniques: true
    include_mitigations: true
    include_data_sources: true
    include_tools: true
    include_groups: false
    include_software: false
    include_malware: false
  lolbins:
    enabled: true
    local_path: ".cache/lolbas/yml"
  gtfobins:
    enabled: true
    local_path: ".cache/gtfobins/_gtfobins"
  payloadsallthethings:
    enabled: true
    local_path: ".cache/payloadsallthethings"
  internalallthethings:
    enabled: true
    local_path: ".cache/internalallthethings/docs"
  hacktricks:
    enabled: true
    local_path: ".cache/hacktricks/src"
  redteamingtactics:
    enabled: true
    local_path: ".cache/redteaming-tactics-and-techniques"

rendering:
  use_full_path_wikilinks: true
  alias_wikilinks: true
  title_in_body: false
  parsed_marker: "focuslocust"

naming:
  style: "id-slug"
  lowercase: true
  separator: "-"
  preserve_dots: true

ghvault:
  enabled: true
  path: "./ghvault"
  manual_path: "manual"
  link_style: "github-relative"
  clear_on_build: true
  provenance:
    include_source_page: true
    include_short_excerpt: true
    include_source_hash: true
  relationships:
    mode: "conservative"
    mark_inferred: true
    preserve_conflicts: true
    flag_conflicts: true
  commands:
    one_page_per_tool_platform: true
    safety_notice: true
  validation:
    write_broken_links_report: true
    strict_default: false
  review:
    always_generate: true
  ollama:
    enabled: false
    mode: "review_only"
    write_to_canonical_pages: false
